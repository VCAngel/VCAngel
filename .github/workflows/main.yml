name: README.md Update
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch README
        run: |
          curl -X GET "${{ secrets.API_ENDPOINT }}" -o temp.md && \
          cat temp.md

      - name: Update README
        run: mv temp.md README.md

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "[Actions] Update README" || echo "No changes to commit! (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧"
          git push
