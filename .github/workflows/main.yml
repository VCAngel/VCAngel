name: README.md Update
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  fetch-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch README
        run: curl -X GET "${{ secrets.API_ENDPOINT }}" -o temp.md

      - name: Print README 
        run: cat temp.md

  update-readme:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Update README
        run: mv temp.md README.md

      - name: Remove temps
        run: rm temp.md

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "[Actions] Update project structure tree" || echo "No changes to commit! (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧"
          git push
